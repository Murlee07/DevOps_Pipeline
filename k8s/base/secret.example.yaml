# EXAMPLE ONLY — do not commit real values. Jenkins creates this Secret at deploy time:
#   kubectl -n shieldboard create secret generic shieldboard-secrets \
#     --from-literal=POSTGRES_PASSWORD=... --from-literal=JWT_SECRET=... \
#     --from-literal=DATABASE_URL=postgres://shieldboard:...@postgres:5432/shieldboard
apiVersion: v1
kind: Secret
metadata:
  name: shieldboard-secrets
  namespace: shieldboard
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me"
  JWT_SECRET: "change-me-to-a-32-plus-character-random-string"
  DATABASE_URL: "postgres://shieldboard:change-me@postgres:5432/shieldboard"
