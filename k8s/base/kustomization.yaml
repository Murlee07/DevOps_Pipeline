apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shieldboard
labels:
  - pairs:
      app.kubernetes.io/part-of: shieldboard
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
# NOTE: the "shieldboard-secrets" Secret is created by Jenkins from credentials
# (or by scripts/k8s-local-deploy.sh). See secret.example.yaml for its shape.
