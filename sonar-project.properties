sonar.projectKey=shieldboard
sonar.projectName=ShieldBoard - Secure DevSecOps Pipeline
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/reports/**

# Backend coverage from Jest (lcov). Frontend is UI-only and excluded from coverage metrics.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.coverage.exclusions=frontend/**,backend/src/server.js,backend/src/db/postgres.js
