# ShieldBoard application stack (frontend + backend + PostgreSQL)
#   docker compose up -d --build        -> http://localhost:3000
# Values come from .env (copy .env.example). Jenkins also uses this file for the "compose" deploy target.
name: shieldboard

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shieldboard
      POSTGRES_USER: shieldboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shieldboard_local_pw}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shieldboard -d shieldboard"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    networks: [backend-net]

  backend:
    image: ${DOCKER_REGISTRY:-murlee7}/shieldboard-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      args:
        APP_VERSION: ${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgres://shieldboard:${POSTGRES_PASSWORD:-shieldboard_local_pw}@db:5432/shieldboard
      JWT_SECRET: ${JWT_SECRET:-local-only-jwt-secret-change-me-0123456789}
      DEPLOY_ENV: ${DEPLOY_ENV:-docker-compose}
      BUILD_NUMBER: ${BUILD_NUMBER:-local}
      GIT_COMMIT: ${GIT_COMMIT:-local}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [backend-net, frontend-net]

  frontend:
    image: ${DOCKER_REGISTRY:-murlee7}/shieldboard-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "${APP_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [frontend-net]

networks:
  backend-net:
  frontend-net:

volumes:
  db-data:
